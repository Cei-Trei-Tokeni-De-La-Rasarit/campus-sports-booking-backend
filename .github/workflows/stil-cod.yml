# Verifică stilul codului (PEP 8, cu Ruff) la fiecare pull request către main.
name: Stil cod

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează Ruff
        run: pip install ruff==0.17.4
      - name: Verifică regulile (ruff check)
        run: ruff check .
      - name: Verifică formatarea (ruff format)
        run: ruff format --check .
